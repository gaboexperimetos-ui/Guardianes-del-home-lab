name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts are executable
        run: |
          status=0
          for f in scripts/*; do
            if [[ ! -x "$f" ]]; then
              echo "ERROR: $f is not executable"
              status=1
            fi
          done
          exit $status
      - name: Syntax check (bash)
        run: |
          status=0
          for f in scripts/*; do
            bash -n "$f" || { echo "ERROR: syntax error in $f"; status=1; }
          done
          exit $status