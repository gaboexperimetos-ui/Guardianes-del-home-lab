name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check scripts are executable
        run: |
          for f in *.sh; do
            if [[ ! -x "$f" ]]; then
              echo "ERROR: $f is not executable"
              exit 1
            fi
          done
